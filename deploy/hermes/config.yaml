# Hermes runtime configuration for the ProductFactory orchestrator.
# Uses the host's local Ollama server — zero API cost, fully offline.
# Override the model name in .env via HERMES_MODEL to experiment with other
# Gemma/Qwen/Llama variants without rebuilding the image.

provider: ollama
model: ${HERMES_MODEL:-gemma4:26b}
# Ollama runs on the Windows/Linux host; Hermes reaches it via host-gateway.
# docker-compose passes OLLAMA_HOST into the container (see docker-compose.yml).
base_url: ${OLLAMA_HOST:-http://host.docker.internal:11434}

# Hermes's own terminal (used for tool execution, not agent work).
terminal:
  backend: local

# ProductFactory plugin directory is bind-mounted into the container at
# /home/hermes/.hermes/plugins/productfactory
plugins:
  - productfactory

# Each 60s poll cycle is bounded — we don't want open-ended reasoning.
context:
  max_iterations: 30

# Reasoning depth — "low" keeps latency down; the skill is prescriptive.
reasoning_effort: low
