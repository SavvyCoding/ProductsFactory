# Hermes runtime configuration for the ProductFactory orchestrator.
# Uses the host's local Ollama server — zero API cost, fully offline.
#
# Format matches what `hermes model` writes when you save a custom
# provider: `model:` is a DICT (not a string), with provider/base_url/api_key
# at that nested level. `custom_providers:` is the durable registry.

model:
  default: qwen3-coder-64k:30b
  provider: custom
  base_url: http://host.docker.internal:11434/v1
  api_key: ollama              # required field; Ollama ignores the value
  api_mode: chat_completions

custom_providers:
  - name: local-ollama
    base_url: http://host.docker.internal:11434/v1
    api_key: ollama
    api_mode: chat_completions
    model: qwen3-coder-64k:30b

toolsets:
  - hermes-cli
  - productfactory

# Plugins are opt-in — must be explicitly allow-listed here.
# (hermes plugins enable <name> writes to this list; baking it in makes
# the state survive volume resets + image rebuilds.)
plugins:
  enabled:
    - productfactory

terminal:
  backend: local

context:
  max_iterations: 30
