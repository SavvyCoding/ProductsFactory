# ProductFactory — Infrastructure services
# Runs: PostgreSQL + PM website
# The poller runs natively on Windows (see deploy/windows/start_poller.ps1)
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f
# Stop:   docker compose down
# Reset:  docker compose down -v   (WARNING: deletes DB data)

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ProductsFactoryDB
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-productfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ProductDBPassword}
      POSTGRES_DB:       ${POSTGRES_DB:-productfactory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"     # exposed to Windows host for local pytest runs
    networks:
      - pf-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productfactory -d productfactory"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── PM Website (FastAPI) ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: pm-api
    environment:
      # db resolves via pf-internal compose network
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-productfactory}:${POSTGRES_PASSWORD:-ProductDBPassword}@db:5432/${POSTGRES_DB:-productfactory}
      PM_USERNAME: ${PM_USERNAME:-admin}
      PM_PASSWORD: ${PM_PASSWORD:-ProductDBPassword}
      STUCK_FEATURE_TIMEOUT_HOURS: ${STUCK_FEATURE_TIMEOUT_HOURS:-2}
      SESSION_LOG_MAXLEN: ${SESSION_LOG_MAXLEN:-1000}
      # Set this to enable AI feature recommendations on the Greenfield form
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Host path to the products root — used to map working_dir → /workspace for video serving
      PRODUCTS_BASE_DIR: ${PRODUCTS_BASE_DIR:-}
    volumes:
      # Mount products root read-only so the PM dashboard can serve output/ videos
      # Set PRODUCTS_BASE_DIR in your .env, e.g. PRODUCTS_BASE_DIR=C:/Users/you/Products
      - ${PRODUCTS_BASE_DIR:-./products}:/workspace:ro
      # Mount Claude OAuth tokens + config so the web container can use claude CLI
      - ${CLAUDE_DIR:-~/.claude}:/root/.claude:ro
      - ${CLAUDE_CONFIG_JSON:-~/.claude.json}:/root/.claude.json:ro
    ports:
      - "8080:8080"     # exposed to Windows host: poller uses http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pf-internal
      - productfactory-net   # agent containers reach pm-api via host-gateway:8080
    restart: unless-stopped

networks:
  # Internal compose network — db ↔ web only
  pf-internal:
    driver: bridge

  # Agent isolation network — pre-created by deploy/docker/build.sh
  productfactory-net:
    external: true

volumes:
  postgres_data:
    name: productfactory-postgres-data
