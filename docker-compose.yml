# ProductFactory — Infrastructure services
# Runs: PostgreSQL + PM website + Hermes orchestrator
# (Legacy Windows poller still works via deploy/windows/start_poller.ps1 for
# host-mode fallback; Hermes is the preferred production path.)
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f
# Stop:   docker compose down
# Reset:  docker compose down -v   (WARNING: deletes DB data)

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ProductsFactoryDB
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-productfactory}
      # No default — POSTGRES_PASSWORD must be set explicitly in .env (fail-fast on unset).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-productfactory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"     # exposed to Windows host for local pytest runs
    networks:
      - pf-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productfactory -d productfactory"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── PM Website (FastAPI) ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: pm-api
    environment:
      # db resolves via pf-internal compose network
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-productfactory}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-productfactory}
      PM_USERNAME: ${PM_USERNAME:-admin}
      # No default — PM_PASSWORD must be set in .env.
      PM_PASSWORD: ${PM_PASSWORD:?PM_PASSWORD must be set in .env}
      STUCK_FEATURE_TIMEOUT_HOURS: ${STUCK_FEATURE_TIMEOUT_HOURS:-2}
      SESSION_LOG_MAXLEN: ${SESSION_LOG_MAXLEN:-1000}
      # Set this to enable AI feature recommendations on the Greenfield form
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Host path to the products root — used to map working_dir → /workspace for video serving
      PRODUCTS_BASE_DIR: ${PRODUCTS_BASE_DIR:-}
    volumes:
      # Mount products root read-only so the PM dashboard can serve output/ videos
      # Set PRODUCTS_BASE_DIR in your .env, e.g. PRODUCTS_BASE_DIR=C:/Users/you/Products
      - ${PRODUCTS_BASE_DIR:-./products}:/workspace:ro
      # Mount Claude OAuth tokens + config so the web container can use claude CLI
      - ${CLAUDE_DIR:-~/.claude}:/root/.claude:ro
      - ${CLAUDE_CONFIG_JSON:-~/.claude.json}:/root/.claude.json:ro
    ports:
      - "8080:8080"     # exposed to Windows host: poller uses http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pf-internal
      - productfactory-net   # agent containers reach pm-api via host-gateway:8080
    restart: unless-stopped

  # ── Hermes orchestrator (replaces the Windows poller) ──────────────────────
  # Opt-in via `--profile hermes` — keeps the legacy Windows poller path
  # available for hosts that haven't migrated yet.
  #
  # Hermes runs a persistent gateway daemon; a 60s cron fires the orchestrate.md
  # skill, which drives the ProductFactory sprint pipeline via custom tools.
  hermes:
    profiles: ["hermes"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.hermes
    image: productfactory-hermes
    container_name: pf-hermes
    # host.docker.internal resolves to the host on Docker Desktop; on Linux we
    # still need the extra_hosts mapping below to reach the host's Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Hermes LLM backend — local Ollama, no API keys needed.
      OLLAMA_HOST:        ${OLLAMA_HOST:-http://host.docker.internal:11434}
      HERMES_MODEL:       ${HERMES_MODEL:-gemma4:26b}
      PM_API_URL:         http://pm-api:8080
      PM_API_URL_CONTAINER: http://pm-api:8080
      # Path duality — orchestrator/paths.py uses both *_HOST and container
      # values to translate between the Hermes filesystem and `docker run -v`
      # mount sources (which are resolved by the Docker daemon on the host).
      PRODUCTS_BASE_DIR:  ${PRODUCTS_BASE_DIR:?PRODUCTS_BASE_DIR must be set in .env}
      PRODUCTS_MOUNT_PATH: /products
      CLAUDE_DIR_HOST:    ${CLAUDE_DIR:-~/.claude}
      CLAUDE_DIR:         /home/hermes/.claude
      SSH_DIR_HOST:       ${SSH_DIR:-~/.ssh}
      SSH_DIR:            /home/hermes/.ssh
      HERMES_STAGING_HOST: ${HERMES_STAGING_HOST:?HERMES_STAGING_HOST must be set in .env (host tmpdir for creds staging)}
      HERMES_STAGING_CONTAINER: /hermes-staging
      # Python's tempfile.mkdtemp lands in /hermes-staging so `docker run -v`
      # can mount it via the matching host path.
      TMPDIR:             /hermes-staging
      AGENT_IMAGE:        ${AGENT_IMAGE:-productfactory-agent}
      PM_USERNAME:        ${PM_USERNAME:-admin}
      PM_PASSWORD:        ${PM_PASSWORD:?PM_PASSWORD must be set in .env}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-90}
      STALE_THRESHOLD_MINUTES: ${STALE_THRESHOLD_MINUTES:-45}
      MAX_OPEN_PRS:       ${MAX_OPEN_PRS:-3}
      MAX_FEATURES_PER_RUN: ${MAX_FEATURES_PER_RUN:-1}
    volumes:
      # Docker socket — Hermes spawns agent containers via the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Product working directories — Hermes uses /products for its own file
      # ops but passes the host path verbatim when launching agents.
      - ${PRODUCTS_BASE_DIR}:/products
      # Claude OAuth creds (read-only — docker_runner copies to staging and
      # patches settings.json there before mounting into the agent).
      - ${CLAUDE_DIR:-~/.claude}:/home/hermes/.claude:ro
      # SSH deploy keys (read-only)
      - ${SSH_DIR:-~/.ssh}:/home/hermes/.ssh:ro
      # Staging dir — bind-mounted from host at the same logical location so
      # that `docker run -v ${HERMES_STAGING_HOST}/xxx:/...` resolves for both
      # the Hermes Python process (as /hermes-staging/xxx) and the Docker
      # daemon (as the host path). This is how temp creds reach spawned agents.
      - ${HERMES_STAGING_HOST}:/hermes-staging
      # Persist Hermes cron jobs + memory across restarts
      - hermes_home:/home/hermes/.hermes
    ports:
      # Hermes web dashboard (config, sessions, cron, memory inspection).
      # Browse http://localhost:9119 once the container is up.
      - "9119:9119"
    depends_on:
      web:
        condition: service_started
    networks:
      - pf-internal
      - productfactory-net
    restart: unless-stopped

  # ── Caddy HTTPS reverse proxy (opt-in via `--profile tls`) ──────────────────
  # Terminates TLS in front of the PM website and sets security headers.
  # Default CADDY_SITE=localhost uses Caddy's internal CA (run `caddy trust`
  # inside the container once to install the root cert to the host browser).
  # For a real deployment set CADDY_SITE=your-domain.com in .env — Caddy will
  # obtain a Let's Encrypt cert automatically.
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    container_name: pf-caddy
    environment:
      CADDY_SITE: ${CADDY_SITE:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certs + ACME account — must survive restarts
      - caddy_config:/config
    ports:
      - "443:443"
      - "80:80"                   # ACME HTTP-01 challenge + HTTP→HTTPS redirect
    depends_on:
      - web
    networks:
      - pf-internal
    restart: unless-stopped

networks:
  # Internal compose network — db ↔ web only
  pf-internal:
    driver: bridge

  # Agent isolation network — pre-created by deploy/docker/build.sh
  productfactory-net:
    external: true

volumes:
  postgres_data:
    name: productfactory-postgres-data
  # Caddy's persistent state (TLS certs, ACME account keys)
  caddy_data:
    name: productfactory-caddy-data
  caddy_config:
    name: productfactory-caddy-config
  # Hermes ~/.hermes — cron jobs, memory, session history
  hermes_home:
    name: productfactory-hermes-home
