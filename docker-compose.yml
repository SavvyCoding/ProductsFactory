# ProductFactory — Infrastructure services
# Runs: PostgreSQL + PM website + Orchestrator container
# (The legacy Windows host-mode poller was retired 2026-05-18. Orchestration
# now runs only inside the pf-orchestrator container — see profile below.)
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f
# Stop:   docker compose down
# Reset:  docker compose down -v   (WARNING: deletes DB data)

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ProductsFactoryDB
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-productfactory}
      # No default — POSTGRES_PASSWORD must be set explicitly in .env (fail-fast on unset).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-productfactory}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"     # exposed to Windows host for local pytest runs
    networks:
      - pf-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productfactory -d productfactory"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── PM Website (FastAPI) ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: pm-api
    environment:
      # db resolves via pf-internal compose network
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-productfactory}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-productfactory}
      PM_USERNAME: ${PM_USERNAME:-admin}
      # No default — PM_PASSWORD must be set in .env.
      PM_PASSWORD: ${PM_PASSWORD:?PM_PASSWORD must be set in .env}
      # Shared internal secret. When set on BOTH web and orchestrator it (a) masks
      # secret fields on GET /api/system-config for callers without the token, and
      # (b) keys HMAC-signing of internal /api/* writes. Empty = transparent no-op.
      PF_INTERNAL_API_SECRET: ${PF_INTERNAL_API_SECRET:-}
      STUCK_FEATURE_TIMEOUT_HOURS: ${STUCK_FEATURE_TIMEOUT_HOURS:-2}
      SESSION_LOG_MAXLEN: ${SESSION_LOG_MAXLEN:-1000}
      # Set this to enable AI feature recommendations on the Greenfield form
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Host path to the products root — used to map working_dir → /workspace for video serving
      PRODUCTS_BASE_DIR: ${PRODUCTS_BASE_DIR:-}
      # code_auditor flags are mirrored here (also set on `orchestrator`) so the
      # PM dashboard can render the Workflow card checkboxes with the EFFECTIVE
      # state (per-product config override OR global env). Without this the web
      # container sees them empty and an unchecked box could silently disable the
      # running soak on save. Values must match the orchestrator service.
      CODE_AUDITOR_ENABLED: ${CODE_AUDITOR_ENABLED:-1}
      CODE_AUDITOR_FILING_ENABLED: ${CODE_AUDITOR_FILING_ENABLED:-}
      SECURITY_AUDITOR_SCHEDULED_ENABLED: ${SECURITY_AUDITOR_SCHEDULED_ENABLED:-1}
      # Fix 2a (2026-07-27): dedup AI-filed audit bugs against open/shipped
      # features at POST /api/features (this is the web/create path). Default ON.
      AUDIT_DEDUP_ENABLED: ${AUDIT_DEDUP_ENABLED:-1}
    volumes:
      # Mount products root read-only so the PM dashboard can serve output/ videos
      # Set PRODUCTS_BASE_DIR in your .env, e.g. PRODUCTS_BASE_DIR=C:/Users/you/Products
      - ${PRODUCTS_BASE_DIR:-./products}:/workspace:ro
      # Mount Claude OAuth tokens + config so the web container can use claude CLI
      - ${CLAUDE_DIR:-~/.claude}:/root/.claude:ro
      - ${CLAUDE_CONFIG_JSON:-~/.claude.json}:/root/.claude.json:ro
    ports:
      - "8080:8080"     # exposed to Windows host: poller uses http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pf-internal
      - productfactory-net   # agent containers reach pm-api via host-gateway:8080
    restart: unless-stopped

  # ── Orchestrator (replaces the Windows poller) ──────────────────────────────
  # Opt-in via `--profile orchestrator`. Runs a simple Python loop that calls
  # run_cycle() every 60s to launch agent containers. No LLM — deterministic.
  # Claude is reserved for agent personas (coder, designer, reviewer).
  orchestrator:
    profiles: ["orchestrator"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.orchestrator
    image: productfactory-orchestrator
    container_name: pf-orchestrator
    # Start as root so bootstrap.sh can chown/chmod the bind-mounted SSH dir
    # (Docker Desktop surfaces Windows-host files as root:root 777, which
    # OpenSSH rejects). bootstrap.sh re-execs as `orchestrator` immediately
    # after fixing perms — the orchestration loop never runs as root.
    user: "0"
    # Docker Desktop for Windows: socket is owned by root:root (GID 0).
    group_add:
      - "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PM_API_URL:         http://pm-api:8080
      PRODUCTS_BASE_DIR:  ${PRODUCTS_BASE_DIR:?PRODUCTS_BASE_DIR must be set in .env}
      PRODUCTS_MOUNT_PATH: /products
      CLAUDE_DIR_HOST:    ${CLAUDE_DIR:-~/.claude}
      CLAUDE_DIR:         /home/orchestrator/.claude
      SSH_DIR_HOST:       ${SSH_DIR:-~/.ssh}
      SSH_DIR:            /home/orchestrator/.ssh
      ORCHESTRATOR_STAGING_HOST: ${ORCHESTRATOR_STAGING_HOST:?ORCHESTRATOR_STAGING_HOST must be set in .env (host tmpdir for creds staging)}
      ORCHESTRATOR_STAGING_CONTAINER: /orchestrator-staging
      TMPDIR:             /orchestrator-staging
      AGENT_IMAGE:        ${AGENT_IMAGE:-productfactory-agent}
      PM_USERNAME:        ${PM_USERNAME:-admin}
      PM_PASSWORD:        ${PM_PASSWORD:?PM_PASSWORD must be set in .env}
      # Must match the web service's value — sends X-PF-Internal-Token so
      # GET /api/system-config returns real secrets (else they're masked) and
      # signs internal writes. Empty = transparent no-op (back-compat).
      PF_INTERNAL_API_SECRET: ${PF_INTERNAL_API_SECRET:-}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-90}
      MAX_FEATURES_PER_RUN: ${MAX_FEATURES_PER_RUN:-1}
      ORCHESTRATION_CYCLE_SECONDS: ${ORCHESTRATION_CYCLE_SECONDS:-60}
      # Corrective-chore reconciler: high-severity drift findings (e.g. duplicate
      # DDL) are filed as Approved priority=1 chore features for the coder pipeline
      # to fix. ALWAYS ON per product (the per-product opt-out + UI checkbox were
      # removed 2026-07-16); this global env flag is the only kill switch — default
      # ON, set to a falsy value to disable the whole environment. Orchestrator-
      # global (applies to whatever product's coder session just ran).
      RECONCILER_CHORES_ENABLED: ${RECONCILER_CHORES_ENABLED:-1}
      # Verify-check gate (2026-05-30): runs the per-AC `Verify:` recipes from
      # docs/story_<id>.md and bounces features whose actual output diverges
      # from `Expected:`. Catches the coder-self-reporting gaming pattern
      # surfaced on DocumentSign #1119. Default off; flip to 1 in .env to
      # exercise. Recipes that need a running server are SKIPPED (not bounced)
      # because the post-coder pipeline doesn't currently spin up the app —
      # adding uvicorn-bg startup for FastAPI products is a follow-up.
      POST_CODER_VERIFY_CHECK_ENABLED: ${POST_CODER_VERIFY_CHECK_ENABLED:-}
      # Whole-product semantic audit (2026-06-24; single-checkbox + default-ON
      # 2026-07-16): read-only review fired on the architect-run cadence. This ONE
      # flag now enables BOTH code_auditor (correctness/tests) and security_auditor
      # (security) — see SECURITY_AUDITOR_SCHEDULED_ENABLED below, defaulted ON to
      # match. Default ON (`:-1`); set CODE_AUDITOR_ENABLED=0 in .env to kill
      # globally, or opt a product out via product.config.code_auditor=false.
      CODE_AUDITOR_ENABLED: ${CODE_AUDITOR_ENABLED:-1}
      # code_auditor cadence: audit after this many architect runs since the last
      # audit. Default 1 during the soak (one audit per architect pass = max
      # precision-sample density); steady-state target 2. Recreate (no rebuild)
      # to change.
      CODE_AUDIT_ARCHITECT_RUNS: ${CODE_AUDIT_ARCHITECT_RUNS:-1}
      # Filing promotion (Increment 1, 2026-06-25): when ON, code_auditor FILES
      # each finding as a `bug` feature (status=Pending → PM triages) instead of
      # only raising alerts. Severity → priority (Critical 1 / High 5 / Medium 20
      # / Low 40). No stop-the-line yet (Increment 2 adds the verifier session +
      # blocker gate). Default off; per-product override product.config.code_auditor_filing.
      CODE_AUDITOR_FILING_ENABLED: ${CODE_AUDITOR_FILING_ENABLED:-}
      # security_auditor scheduling (2026-07-16): promotes the whole-product security
      # sweep from PM-button-only to the same architect-run cadence as code_auditor
      # (its own counter, serialized via run_persona_now). Pairs with dropping the
      # security dimension from code_auditor. Always files bugs. Default off; per-
      # product override product.config.security_auditor_scheduled.
      SECURITY_AUDITOR_SCHEDULED_ENABLED: ${SECURITY_AUDITOR_SCHEDULED_ENABLED:-1}
      # Factory spec-and-filing guards (2026-07-27).
      # Fix 1: designer AC-recipe self-check in post_doc — statically validates
      # every Verify: recipe (shell syntax + Expected JSON) before it reaches a
      # coder. ENABLED default ON; ENFORCE off = ADVISORY (comment, ship) during
      # soak, set ENFORCE=1 to hard-bounce malformed recipes.
      DESIGNER_AC_LINT_ENABLED: ${DESIGNER_AC_LINT_ENABLED:-1}
      DESIGNER_AC_LINT_ENFORCE: ${DESIGNER_AC_LINT_ENFORCE:-}
      AUDIT_DEDUP_ENABLED: ${AUDIT_DEDUP_ENABLED:-1}
      # Fix 2b: independent audit verifier — re-checks newly-filed audit bugs on
      # a DIFFERENT model and Rejects false positives. Default ON. AUDIT_VERIFIER_MODEL
      # empty = the designer model (already distinct from the coder/auditor); set
      # it to a different Ollama model (e.g. deepseek / qwen) for stronger independence.
      AUDIT_VERIFIER_ENABLED: ${AUDIT_VERIFIER_ENABLED:-1}
      AUDIT_VERIFIER_MODEL: ${AUDIT_VERIFIER_MODEL:-}
      # Agent backend — `ollama` for local/offline/TOS-compliant, `claude` for API
      AGENT_BACKEND:      ${AGENT_BACKEND:-ollama}
      # OLLAMA_HOST: leave overridable via .env so we can switch between local
      # Ollama (http://host.docker.internal:11434) and Ollama Cloud
      # (https://ollama.com) without recompose. Default is local for back-compat.
      OLLAMA_HOST:        ${OLLAMA_HOST_OVERRIDE:-http://host.docker.internal:11434}
      OLLAMA_API_KEY:     ${OLLAMA_API_KEY:-}
      DESIGNER_MODEL:     ${DESIGNER_MODEL:-gemma3:27b}
      CODER_MODEL:        ${CODER_MODEL:-qwen3-coder:30b}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PRODUCTS_BASE_DIR}:/products
      - ${CLAUDE_DIR:-~/.claude}:/home/orchestrator/.claude:ro
      # .claude.json sits alongside .claude/ on the host and is required by Claude Code
      # for initialisation. Without it, claude -p hangs waiting for onboarding input.
      - ${CLAUDE_CONFIG_JSON:-~/.claude.json}:/home/orchestrator/.claude.json:ro
      # RW (not :ro) so greenfield scaffolding can ssh-keygen per-product
      # deploy keys. Agent containers still mount this :ro — only the
      # orchestrator (which runs trusted Python, no LLM execution) can write.
      - ${SSH_DIR:-~/.ssh}:/home/orchestrator/.ssh
      - ${ORCHESTRATOR_STAGING_HOST}:/orchestrator-staging
    depends_on:
      web:
        condition: service_started
    networks:
      - pf-internal
      - productfactory-net
    restart: unless-stopped

  # ── Caddy HTTPS reverse proxy (opt-in via `--profile tls`) ──────────────────
  # Terminates TLS in front of the PM website and sets security headers.
  # Default CADDY_SITE=localhost uses Caddy's internal CA (run `caddy trust`
  # inside the container once to install the root cert to the host browser).
  # For a real deployment set CADDY_SITE=your-domain.com in .env — Caddy will
  # obtain a Let's Encrypt cert automatically.
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    container_name: pf-caddy
    environment:
      CADDY_SITE: ${CADDY_SITE:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certs + ACME account — must survive restarts
      - caddy_config:/config
    ports:
      - "443:443"
      - "80:80"                   # ACME HTTP-01 challenge + HTTP→HTTPS redirect
    depends_on:
      - web
    networks:
      - pf-internal
    restart: unless-stopped

networks:
  # Internal compose network — db ↔ web only
  pf-internal:
    driver: bridge

  # Agent isolation network — pre-created by deploy/docker/build.sh
  productfactory-net:
    external: true

volumes:
  postgres_data:
    name: productfactory-postgres-data
  # Caddy's persistent state (TLS certs, ACME account keys)
  caddy_data:
    name: productfactory-caddy-data
  caddy_config:
    name: productfactory-caddy-config
