<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ProductFactory{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <nav class="pf-nav">
    <a href="/" class="pf-nav-brand" aria-label="ProductFactory home">
      <span class="pf-nav-brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,1 23,22 1,22"/></svg>
      </span>
      <span class="pf-nav-brand-name">ProductFactory</span>
    </a>

    <div class="pf-nav-tabs">
      <a href="/" class="pf-nav-tab {{ 'is-active' if request.url.path == '/' else '' }}">Products</a>
      <a href="/admin" class="pf-nav-tab {{ 'is-active' if request.url.path.startswith('/admin') else '' }}">Admin</a>
    </div>

    <div class="pf-nav-search">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="search" id="global-search" placeholder="Search features…" aria-label="Search features">
      <kbd>/</kbd>
    </div>

    <div class="pf-nav-spacer"></div>

    <a href="/?filter=running" class="pf-nav-status" id="nav-live" title="Running products">
      <span class="pf-nav-status-dot" id="nav-live-dot"></span>
      <span id="nav-live-text">Idle</span>
    </a>

    {% if alert_count %}
    <a href="/api/alerts/unread" class="pf-nav-icon-btn pf-nav-alerts" title="Unread alerts">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
      <span class="pf-nav-alerts-badge">{{ alert_count }}</span>
    </a>
    {% endif %}

    <button class="pf-nav-icon-btn" onclick="toggleDark()" id="dark-btn"
            title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon pf-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="icon pf-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

    {% if current_pm %}
    <div class="pf-nav-user" title="{{ current_pm }}">
      <span class="pf-nav-avatar">{{ current_pm[0].upper() }}</span>
    </div>
    {% endif %}
  </nav>

  {% block breadcrumb %}{% endblock %}

  {% if error %}
  <div class="flash flash-error">{{ error }}</div>
  {% endif %}

  <main class="page {% block page_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

<script src="/static/js/theme.js"></script>
<script src="/static/js/toast.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/search.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
